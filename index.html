<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e4e8;
    --text: #1c1e21;
    --muted: #8a8f98;
    --accent: #3b82f6;
    --danger: #e5484d;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 90px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .versie { font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 400; }
  header .titel-wrap { display: flex; align-items: baseline; }
  nav {
    position: sticky; top: 53px; z-index: 9;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    overflow-x: auto;
  }
  nav button {
    flex: 1; padding: 10px 6px; border: none; background: none;
    font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  main { padding: 12px; max-width: 640px; margin: 0 auto; }

  .add-bar {
    position: sticky; top: 94px; z-index: 8;
    background: var(--bg);
    padding: 8px 0 12px;
  }
  .add-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
  }
  .add-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .add-row:last-child { margin-bottom: 0; }
  .combo-wrap { position: relative; flex: 1; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
  }
  .suggestions {
    position: absolute; left: 0; right: 0; top: 100%;
    background: #fff; border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 8px 8px; max-height: 180px; overflow-y: auto; z-index: 20;
  }
  .suggestions div { padding: 8px 12px; font-size: 14px; cursor: pointer; }
  .suggestions div:hover, .suggestions div.active { background: var(--bg); }
  .btn-add {
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 0 16px; font-size: 20px; font-weight: 600;
    cursor: pointer; min-width: 44px;
  }
  .detail-row { display: flex; gap: 8px; }

  .categorie-groep { margin-bottom: 18px; }
  .categorie-titel {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    color: var(--muted); letter-spacing: 0.04em; margin: 0 0 6px 4px;
  }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px;
  }
  li.item.afgevinkt { opacity: 0.5; }
  .checkbox {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--accent);
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff;
  }
  li.item.afgevinkt .checkbox { background: var(--accent); }
  .item-main { flex: 1; min-width: 0; }
  .item-naam { font-size: 15px; }
  li.item.afgevinkt .item-naam { text-decoration: line-through; }
  .item-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .badge-winkel {
    font-size: 11px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 100px; padding: 2px 8px; color: var(--muted); white-space: nowrap;
  }
  .edit-btn {
    background: none; border: none; color: var(--muted); font-size: 16px;
    cursor: pointer; padding: 4px; flex-shrink: 0; line-height: 1;
  }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  .maand-strip {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .maand-nav-btn { background: none; border: none; font-size: 20px; color: var(--accent); cursor: pointer; padding: 4px 12px; }
  .maand-label { font-weight: 600; font-size: 15px; }
  .maand-vandaag-btn {
    background: none; border: 1px solid var(--border); border-radius: 100px; color: var(--accent);
    font-size: 12px; padding: 4px 10px; cursor: pointer;
  }
  .agenda-dag-groep.verleden { opacity: 0.5; }

  .verjaardagen-overzicht {
    background: #fff7e6; border: 1px solid #f3d9a4; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 12px; font-size: 13px;
  }
  .verjaardagen-overzicht .titel-rij { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .verjaardagen-overzicht .titel { font-weight: 700; color: #8a6d1f; }
  .verjaardagen-overzicht .rij { padding: 2px 0; }
  .verjaardag-add-icon-btn {
    background: none; border: none; font-size: 18px; cursor: pointer; line-height: 1; position: relative;
  }
  .verjaardag-add-icon-btn .plus-badge {
    position: absolute; bottom: -2px; right: -4px; background: var(--accent); color: #fff;
    border-radius: 50%; width: 13px; height: 13px; font-size: 11px; line-height: 13px; font-weight: 700;
  }

  .afspraak-form-rij { display: flex; gap: 10px; flex-direction: column; }
  @media (min-width: 640px) {
    .afspraak-form-rij { flex-direction: row; align-items: flex-start; }
    .afspraak-form-rij .add-form:first-child { flex: 1.3; }
    .afspraak-form-rij .betrokkenen-form { flex: 1; }
  }
  .betrokkenen-form-titel { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }

  .agenda-dag-groep { margin-bottom: 16px; }
  .agenda-dag-titel {
    font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 6px 4px;
  }
  .agenda-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px;
  }
  .agenda-item .tijd { font-size: 13px; color: var(--muted); min-width: 42px; }
  .agenda-item .titel { flex: 1; font-size: 15px; }
  .agenda-item.verjaardag { background: #fff7e6; }
  .agenda-item .edit-btn { flex-shrink: 0; }
  .wie-badge {
    font-size: 11px; border-radius: 100px; padding: 2px 8px; white-space: nowrap; color: #fff;
  }
  .wie-Ik { background: #3b82f6; }
  .wie-Mijn-vrouw { background: #ec4899; }
  .wie-Samen { background: #10b981; }

  .betrokkene-avatar { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; overflow: hidden; display: inline-flex; }
  .betrokkene-avatar svg { width: 100%; height: 100%; }
  .betrokkenen-rij { display: flex; gap: 4px; flex-shrink: 0; }
  .betrokkenen-kies { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
  .betrokkene-optie {
    display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--border);
    border-radius: 100px; padding: 4px 10px 4px 4px; cursor: pointer; font-size: 13px; user-select: none;
  }
  .betrokkene-optie.gekozen { border-color: var(--accent); background: #eaf1fe; }
  .betrokkene-optie input { display: none; }

  .vaste-artikelen-link {
    display: block; text-align: center; font-size: 13px; color: var(--accent);
    padding: 14px; cursor: pointer;
  }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; width: 100%; max-width: 640px; max-height: 80vh;
    border-radius: 16px 16px 0 0; padding: 16px; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 12px; font-size: 16px; }
  .modal-close { float: right; border: none; background: none; font-size: 20px; color: var(--muted); cursor: pointer; }
  .vast-item-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .vast-item-row .naam { flex: 1; font-size: 14px; }
  .vast-item-row .cat { font-size: 12px; color: var(--muted); }
  .vast-add-to-list-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    font-size: 12px; padding: 5px 10px; cursor: pointer; white-space: nowrap;
  }
  .vast-item-row button[data-action="delete"] { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="titel-wrap">
    <h1>🏠 Gezin</h1>
    <span class="versie" id="versie-label"></span>
  </div>
</header>
<nav>
  <button class="tab-btn active" data-tab="boodschappen">🛒 Boodschappen</button>
  <button class="tab-btn" data-tab="kalender">📅 Kalender</button>
  <button class="tab-btn" data-tab="taken" disabled title="Nog te bouwen">✅ Taken</button>
  <button class="tab-btn" data-tab="recepten" disabled title="Nog te bouwen">📖 Recepten</button>
</nav>

<main>
  <section id="tab-content-boodschappen" class="tab-content">
    <div class="add-bar">
      <div class="add-form">
        <div class="add-row">
          <div class="combo-wrap">
            <input id="naam-input" type="text" placeholder="Wat heb je nodig?" autocomplete="off">
            <div id="suggestions" class="suggestions" style="display:none;"></div>
          </div>
          <button class="btn-add" id="add-btn" title="Toevoegen">+</button>
        </div>
        <div class="add-row detail-row">
          <input id="detail-input" type="text" placeholder="Aantal/gewicht (optioneel)">
          <input id="winkel-input" type="text" placeholder="Winkel (optioneel)">
        </div>
        <div class="add-row">
          <select id="categorie-select"></select>
        </div>
      </div>
    </div>

    <div id="lijst"></div>

    <div class="vaste-artikelen-link" id="open-vaste-artikelen">⚙️ Vaste artikelen beheren</div>
  </section>

  <section id="tab-content-kalender" class="tab-content" style="display:none;">
    <div class="maand-strip">
      <button id="maand-vorige" class="maand-nav-btn">‹</button>
      <span id="maand-label" class="maand-label"></span>
      <button id="maand-volgende" class="maand-nav-btn">›</button>
      <button id="maand-vandaag" class="maand-vandaag-btn">Vandaag</button>
    </div>

    <div id="verjaardagen-overzicht"></div>

    <div class="add-bar">
      <div class="afspraak-form-rij">
        <div class="add-form">
          <div class="add-row">
            <input id="afspraak-titel-input" type="text" placeholder="Titel afspraak">
          </div>
          <div class="add-row">
            <input id="afspraak-datum-input" type="date">
          </div>
          <div class="add-row">
            <input id="afspraak-tijd-input" type="time" step="300" placeholder="Starttijd (optioneel)">
            <input id="afspraak-eindtijd-input" type="time" step="300" placeholder="Eindtijd (optioneel)">
          </div>
          <div class="add-row">
            <select id="afspraak-herhaal-select">
              <option value="">Herhaalt niet</option>
              <option value="wekelijks">Elke week</option>
              <option value="tweewekelijks">Elke 2 weken</option>
              <option value="maandelijks">Elke maand</option>
            </select>
          </div>
          <div class="add-row">
            <button class="btn-add" id="afspraak-add-btn" title="Toevoegen" style="width:100%;">+ Toevoegen</button>
          </div>
        </div>
        <div class="add-form betrokkenen-form">
          <div class="betrokkenen-form-titel">Deelnemers</div>
          <div class="betrokkenen-kies" id="afspraak-betrokkenen-kies"></div>
        </div>
      </div>
    </div>

    <div id="agenda-lijst"></div>
  </section>
</main>

<div class="modal-overlay" id="verjaardag-modal-overlay">
  <div class="modal">
    <button class="modal-close" id="close-verjaardag-modal">✕</button>
    <h2>Verjaardag toevoegen</h2>
    <div class="add-row">
      <input id="verjaardag-naam-input" type="text" placeholder="Naam">
    </div>
    <div class="add-row">

// Vaste, voorgedefinieerde categorieën — volgorde bepaalt sortering.
// Volgt de looproute door de supermarkt.
const CATEGORIEEN = [
  'Groente en fruit', 'Broodbeleg', 'Buitenlands', 'Diervoeding', 'Huishouden',
  'Conserven', 'Broodafdeling', 'Zuivel', 'Dranken', 'Chips en nootjes',
  'Snoep en koek', 'Diepvries', 'Overig',
];

// ---------------------------------------------------------------
// App module — pure logic, geen DOM/Supabase-afhankelijkheid waar mogelijk,
// zodat het los te testen is via jsdom + gemockte supabase-client.
// ---------------------------------------------------------------
const GezinBoodschappen = (function () {

  function sortItems(items) {
    // Groepeert op categorie (in vaste volgorde), binnen elke categorie:
    // onafgevinkt eerst (alfabetisch), dan afgevinkt (alfabetisch).
    const groups = {};
    for (const cat of CATEGORIEEN) groups[cat] = { open: [], afgevinkt: [] };

    for (const item of items) {
      const cat = CATEGORIEEN.includes(item.categorie) ? item.categorie : 'Overig';
      if (item.afgevinkt) groups[cat].afgevinkt.push(item);
      else groups[cat].open.push(item);
    }

    const byNaam = (a, b) => a.naam.localeCompare(b.naam, 'nl');
    const result = [];
    for (const cat of CATEGORIEEN) {
      const g = groups[cat];
      g.open.sort(byNaam);
      g.afgevinkt.sort(byNaam);
      if (g.open.length === 0 && g.afgevinkt.length === 0) continue;
      result.push({ categorie: cat, items: [...g.open, ...g.afgevinkt] });
    }
    return result;
  }

  function isExpiredIncidenteel(item, now) {
    // Incidentele items (geen vast_artikel_id) die >1 dag geleden zijn
    // afgevinkt mogen automatisch verdwijnen.
    if (item.vast_artikel_id) return false;
    if (!item.afgevinkt || !item.afgevinkt_op) return false;
    const afgevinktOp = new Date(item.afgevinkt_op).getTime();
    return (now - afgevinktOp) > 24 * 60 * 60 * 1000;
  }

  function filterSuggestions(vasteArtikelen, query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return vasteArtikelen
      .filter(v => v.naam.toLowerCase().includes(q))
      .sort((a, b) => a.naam.localeCompare(b.naam, 'nl'))
      .slice(0, 8);
  }

  // Vindt een al-op-de-lijst-staand, nog niet afgevinkt item met (nagenoeg)
  // dezelfde naam — gebruikt om dubbele invoer te signaleren vóór het
  // toevoegen, ongeacht of dat gebeurt via vrije tekst of vanuit de vaste lijst.
  function findActiveDuplicate(items, naam) {
    const q = (naam || '').trim().toLowerCase();
    if (!q) return null;
    return items.find(i => !i.afgevinkt && i.naam.trim().toLowerCase() === q) || null;
  }

  function buildInsertPayload({ naam, detail, categorie, winkel, vastArtikel }) {
    if (!naam || !naam.trim()) throw new Error('Naam is verplicht');
    if (!categorie || !CATEGORIEEN.includes(categorie)) throw new Error('Ongeldige categorie');
    return {
      naam: naam.trim(),
      detail: detail && detail.trim() ? detail.trim() : null,
      categorie,
      winkel: winkel && winkel.trim() ? winkel.trim() : null,
      vast_artikel_id: vastArtikel ? vastArtikel.id : null,
      afgevinkt: false,
      afgevinkt_op: null,
    };
  }

  // Bewerken raakt nooit vast_artikel_id/afgevinkt-status — alleen de
  // beschrijvende velden van deze ene rij, ongeacht of hij incidenteel of
  // vanuit de vaste-artikelenlijst is toegevoegd.
  function buildUpdatePayload({ naam, detail, categorie, winkel }) {
    if (!naam || !naam.trim()) throw new Error('Naam is verplicht');
    if (!categorie || !CATEGORIEEN.includes(categorie)) throw new Error('Ongeldige categorie');
    return {
      naam: naam.trim(),
      detail: detail && detail.trim() ? detail.trim() : null,
      categorie,
      winkel: winkel && winkel.trim() ? winkel.trim() : null,
    };
  }

  // Bepaalt wat er moet gebeuren als een item wordt afgevinkt/uitgevinkt.
  // Vast artikel + afvinken -> direct verwijderen (comeback via vaste lijst).
  // Incidenteel + afvinken  -> markeren + timestamp (opruimen na 1 dag).
  // Uitvinken (undo)        -> altijd terug naar onafgevinkt, timestamp weg.
  function toggleAction(item) {
    if (!item.afgevinkt) {
      // wordt afgevinkt
      if (item.vast_artikel_id) {
        return { type: 'delete', id: item.id };
      }
      return { type: 'update', id: item.id, changes: { afgevinkt: true, afgevinkt_op: new Date().toISOString() } };
    }
    // wordt uitgevinkt (alleen mogelijk voor incidentele items, want vaste zijn al weg)
    return { type: 'update', id: item.id, changes: { afgevinkt: false, afgevinkt_op: null } };
  }

  function cleanupExpired(items, now = Date.now()) {
    return items.filter(i => isExpiredIncidenteel(i, now)).map(i => i.id);
  }

  return { sortItems, isExpiredIncidenteel, filterSuggestions, findActiveDuplicate, buildInsertPayload, buildUpdatePayload, toggleAction, cleanupExpired, CATEGORIEEN };
})();

// ---------------------------------------------------------------
// GezinKalender — pure logica voor de Kalender-tab (kern-agenda +
// verjaardagen). Herhalende afspraken en de iCal-feed volgen in een
// latere ronde.
// ---------------------------------------------------------------
const GezinKalender = (function () {

  const BETROKKENEN = [
    { key: 'bert', naam: 'Bert', type: 'persoon', kleur: '#3b82f6', icoon: 'bert' },
    { key: 'ellen', naam: 'Ellen', type: 'persoon', kleur: '#ec4899', icoon: 'ellen' },
    { key: 'porsche', naam: 'Porsche', type: 'auto', kleur: '#9aa0a6', icoon: 'porsche' },
    { key: 'audi', naam: 'Audi', type: 'auto', kleur: '#3b6fd6', icoon: 'audi' },
  ];
  const MAAND_NAMEN = [
    'januari', 'februari', 'maart', 'april', 'mei', 'juni',
    'juli', 'augustus', 'september', 'oktober', 'november', 'december',
  ];

  function toIsoDate(d) {
    // Lokale datum (geen UTC-verschuiving), consistent met de rest van de app.
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function getMonthBounds(year, month) {
    // month is 0-indexed (zoals JS Date), voor consistentie met de rest.
    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    return { first: toIsoDate(first), last: toIsoDate(last) };
  }

  function monthLabel(year, month) {
    return `${MAAND_NAMEN[month]} ${year}`;
  }

  // Bepaalt vanaf welke datum items getoond worden binnen de bekeken maand:
  // in de huidige maand tonen we alleen vandaag en later (geen verleden),
  // in elke andere maand (verleden of toekomst) de hele maand.
  function getViewStartDate(year, month, today) {
    const { first } = getMonthBounds(year, month);
    const isHuidigeMaand = today.getFullYear() === year && today.getMonth() === month;
    return isHuidigeMaand ? toIsoDate(today) : first;
  }

  function computeLeeftijd(jaar, occurrenceYear) {
    if (jaar === null || jaar === undefined) return null;
    return occurrenceYear - jaar;
  }

  // Berekent de verjaardagsdatum van dit specifieke jaar/maand-paar.
  // Geeft null als dag/maand niet binnen deze maand vallen.
  function getBirthdayOccurrencesInMonth(verjaardagen, year, month) {
    return verjaardagen
      .filter(v => (v.maand - 1) === month)
      .map(v => {
        const leeftijd = computeLeeftijd(v.jaar, year);
        return {
          type: 'verjaardag',
          id: v.id,
          naam: v.naam,
          titel: `🎂 ${v.naam}${leeftijd !== null ? ` (${leeftijd} jaar)` : ''}`,
          datum: toIsoDate(new Date(year, month, v.dag)),
          dag: v.dag,
          jaar: v.jaar || null,
          leeftijd,
        };
      });
  }

  // Overzicht van ALLE verjaardagen in de bekeken maand, ongeacht viewStart —
  // dus ook als de dag al is geweest deze maand, in tegenstelling tot de
  // agenda-lijst zelf (die alleen vandaag-en-later toont).
  function getBirthdaysOverviewForMonth(verjaardagen, year, month) {
    return getBirthdayOccurrencesInMonth(verjaardagen, year, month)
      .sort((a, b) => a.dag - b.dag);
  }

  // Supabase geeft een `time`-kolom terug als "HH:MM:SS" (met seconden).
  // Voor weergave (en voor de sortering, die tekstueel vergelijkt) hebben we
  // alleen "HH:MM" nodig — seconden zijn hier zinloos en tonen ze niet.
  function normalizeTijd(t) {
    return t ? t.slice(0, 5) : null;
  }

  // Bouwt de volledige, per-dag-gegroepeerde agenda voor de bekeken maand —
  // de HELE maand, verleden dagen inbegrepen (elke dag krijgt een `verleden`-
  // vlag t.o.v. vandaag, voor visuele dimming in de UI). Volgorde binnen een
  // dag: verjaardagen (hele dag) -> afspraken zonder tijd -> afspraken met tijd (oplopend).
  function buildMonthAgenda(afspraken, verjaardagen, year, month, today) {
    const { first, last } = getMonthBounds(year, month);
    const todayIso = toIsoDate(today);

    const afspraakItems = afspraken
      .filter(a => a.datum >= first && a.datum <= last)
      .map(a => ({ type: 'afspraak', id: a.id, titel: a.titel, datum: a.datum, tijd: normalizeTijd(a.tijd), eindtijd: normalizeTijd(a.eindtijd), betrokkenen: a.betrokkenen || [], reeks_id: a.reeks_id || null }));

    const verjaardagItems = getBirthdayOccurrencesInMonth(verjaardagen, year, month);

    const alleItems = [...afspraakItems, ...verjaardagItems];

    const perDag = {};
    for (const item of alleItems) {
      if (!perDag[item.datum]) perDag[item.datum] = [];
      perDag[item.datum].push(item);
    }

    const dagen = Object.keys(perDag).sort();
    return dagen.map(datum => {
      const items = perDag[datum];
      const verjaardag = items.filter(i => i.type === 'verjaardag');
      const zonderTijd = items.filter(i => i.type === 'afspraak' && !i.tijd);
      const metTijd = items.filter(i => i.type === 'afspraak' && i.tijd).sort((a, b) => a.tijd.localeCompare(b.tijd));
      return { datum, verleden: datum < todayIso, items: [...verjaardag, ...zonderTijd, ...metTijd] };
    });
  }

  function buildAfspraakInsertPayload({ titel, datum, tijd, eindtijd, betrokkenen }) {
    if (!titel || !titel.trim()) throw new Error('Titel is verplicht');
    if (!datum) throw new Error('Datum is verplicht');
    const geldigeKeys = BETROKKENEN.map(b => b.key);
    const gekozen = Array.isArray(betrokkenen) ? betrokkenen : [];
    if (gekozen.length === 0) throw new Error('Kies minstens één betrokkene');
    if (!gekozen.every(k => geldigeKeys.includes(k))) throw new Error('Ongeldige betrokkene');
    const tijdWaarde = tijd && tijd.trim() ? tijd.trim() : null;
    const eindtijdWaarde = eindtijd && eindtijd.trim() ? eindtijd.trim() : null;
    if (eindtijdWaarde && !tijdWaarde) throw new Error('Eindtijd kan alleen samen met een starttijd');
    if (eindtijdWaarde && tijdWaarde && eindtijdWaarde <= tijdWaarde) throw new Error('Eindtijd moet na de starttijd liggen');
    return {
      titel: titel.trim(),
      datum,
      tijd: tijdWaarde,
      eindtijd: eindtijdWaarde,
      betrokkenen: gekozen,
    };
  }

  // Bewerken deelt dezelfde validatieregels als toevoegen — enige verschil
  // is dat dit een bestaande rij bijwerkt, geen nieuwe aanmaakt.
  function buildAfspraakUpdatePayload(velden) {
    return buildAfspraakInsertPayload(velden);
  }

  // -----------------------------------------------------------------
  // Herhalende afspraken — optie A: elke voorkomen is een eigen, losse rij
  // in kalender_afspraken (net zo bewerkbaar/verwijderbaar als een eenmalige
  // afspraak), gegroepeerd via reeks_id. Vooruit gegenereerd tot een horizon,
  // die stilzwijgend wordt verlengd zodra de app 'm ziet naderen.
  // -----------------------------------------------------------------
  const FREQUENTIES = ['wekelijks', 'tweewekelijks', 'maandelijks'];
  const HORIZON_MAANDEN = 12;
  const VERLENG_DREMPEL_MAANDEN = 2;

  function berekenVolgendeDatum(datumIso, frequentie) {
    const [y, m, d] = datumIso.split('-').map(Number);
    if (frequentie === 'wekelijks') {
      const datum = new Date(y, m - 1, d);
      datum.setDate(datum.getDate() + 7);
      return toIsoDate(datum);
    }
    if (frequentie === 'tweewekelijks') {
      const datum = new Date(y, m - 1, d);
      datum.setDate(datum.getDate() + 14);
      return toIsoDate(datum);
    }
    if (frequentie === 'maandelijks') {
      // Ga via de 1e van de volgende maand om JS's automatische dag-overflow
      // te vermijden (anders wordt "31 januari + 1 maand" stilzwijgend "3 maart").
      // Klem de streefdag af op de laatste dag van de doelmaand (bijv. 31 jan -> 28/29 feb).
      const datum = new Date(y, m - 1, 1);
      datum.setMonth(datum.getMonth() + 1);
      const laatsteDagVolgendeMaand = new Date(datum.getFullYear(), datum.getMonth() + 1, 0).getDate();
      datum.setDate(Math.min(d, laatsteDagVolgendeMaand));
      return toIsoDate(datum);
    }
    throw new Error('Ongeldige frequentie');
  }

  // Genereert alle voorkomens vanaf (en inclusief) startDatum tot en met totDatum.
  function genereerReeksData(startDatumIso, frequentie, totDatumIso) {
    const data = [];
    let huidige = startDatumIso;
    while (huidige <= totDatumIso) {
      data.push(huidige);
      huidige = berekenVolgendeDatum(huidige, frequentie);
    }
    return data;
  }

  function berekenNieuweHorizon(vandaag, maanden = HORIZON_MAANDEN) {
    const horizon = new Date(vandaag.getFullYear(), vandaag.getMonth(), vandaag.getDate());
    horizon.setMonth(horizon.getMonth() + maanden);
    return toIsoDate(horizon);
  }

  // Bepaalt of een reeks stilzwijgend verlengd moet worden — waar als de
  // gegenereerde horizon minder dan VERLENG_DREMPEL_MAANDEN vooruit reikt.
  function moetReeksVerlengdWorden(gegenereerdTotIso, vandaag, drempelMaanden = VERLENG_DREMPEL_MAANDEN) {
    const drempelDatum = new Date(vandaag.getFullYear(), vandaag.getMonth(), vandaag.getDate());
    drempelDatum.setMonth(drempelDatum.getMonth() + drempelMaanden);
    return gegenereerdTotIso < toIsoDate(drempelDatum);
  }

  function buildReeksInsertPayload({ frequentie, startDatum, vandaag }) {
    if (!FREQUENTIES.includes(frequentie)) throw new Error('Ongeldige frequentie');
    if (!startDatum) throw new Error('Startdatum is verplicht');
    const horizon = berekenNieuweHorizon(vandaag);
    const datums = genereerReeksData(startDatum, frequentie, horizon);
    return {
      reeksPayload: { frequentie, gegenereerd_tot: horizon, gestopt_op: null },
      datums,
    };
  }

  function buildVerjaardagInsertPayload({ naam, dag, maand, jaar }) {
    if (!naam || !naam.trim()) throw new Error('Naam is verplicht');
    const dagNum = Number(dag);
    const maandNum = Number(maand);
    if (!Number.isInteger(dagNum) || dagNum < 1 || dagNum > 31) throw new Error('Ongeldige dag');
    if (!Number.isInteger(maandNum) || maandNum < 1 || maandNum > 12) throw new Error('Ongeldige maand');
    let jaarNum = null;
    if (jaar !== null && jaar !== undefined && String(jaar).trim() !== '') {
      jaarNum = Number(jaar);
      const huidigJaar = new Date().getFullYear();
      if (!Number.isInteger(jaarNum) || jaarNum < 1900 || jaarNum > huidigJaar) throw new Error('Ongeldig geboortejaar');
    }
    return { naam: naam.trim(), dag: dagNum, maand: maandNum, jaar: jaarNum };
  }

  return {
    BETROKKENEN, MAAND_NAMEN, FREQUENTIES, toIsoDate, getMonthBounds, monthLabel, getViewStartDate, computeLeeftijd, normalizeTijd,
    getBirthdayOccurrencesInMonth, getBirthdaysOverviewForMonth, buildMonthAgenda, buildAfspraakInsertPayload, buildAfspraakUpdatePayload, buildVerjaardagInsertPayload,
    berekenVolgendeDatum, genereerReeksData, berekenNieuweHorizon, moetReeksVerlengdWorden, buildReeksInsertPayload,
  };
})();

if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  (function initApp() {
    const supabase = window.supabase && window.supabase.createClient
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    let items = [];

    function populateCategorieSelects() {

      }
    }
    populateCategorieSelects();

    naamInput.addEventListener('input', () => {
      selectedVastArtikel = null;
      const matches = GezinBoodschappen.filterSuggestions(vasteArtikelen, naamInput.value);
      if (matches.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
      }
      suggestionsBox.innerHTML = matches.map(m => `<div data-id="${m.id}">${m.naam}</div>`).join('');
      suggestionsBox.style.display = 'block';

    suggestionsBox.addEventListener('click', (e) => {
      const id = e.target.getAttribute('data-id');
      if (!id) return;
      const v = vasteArtikelen.find(x => String(x.id) === String(id));
      if (!v) return;
      selectedVastArtikel = v;
      naamInput.value = v.naam;
      categorieSelect.value = v.categorie;

    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.combo-wrap')) suggestionsBox.style.display = 'none';
    });

    async function insertItem(payload) {
      const duplicate = GezinBoodschappen.findActiveDuplicate(items, payload.naam);
      if (duplicate) {
        const doorgaan = confirm(`"${payload.naam}" staat al op de lijst. Toch nogmaals toevoegen?`);
        if (!doorgaan) return false;
      }
      const { error } = await supabase.from('boodschappen_items').insert(payload);
      if (error) { alert('Kon niet toevoegen: ' + error.message); return false; }
      return true;
    }

    async function addItem() {
      let payload;
      try {
        payload = GezinBoodschappen.buildInsertPayload({
          naam: naamInput.value,
          detail: detailInput.value,
          categorie: categorieSelect.value,
          winkel: winkelInput.value,
          vastArtikel: selectedVastArtikel,
        });
      } catch (err) {
        alert(err.message);
        return;
      }
      const ok = await insertItem(payload);
      if (!ok) return;
      naamInput.value = '';
      detailInput.value = '';
      winkelInput.value = '';
      selectedVastArtikel = null;
      naamInput.focus();
    }
    addBtn.addEventListener('click', addItem);
    naamInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(); });

    async function toggleItem(item) {
      const action = GezinBoodschappen.toggleAction(item);
      if (action.type === 'delete') {
        await supabase.from('boodschappen_items').delete().eq('id', action.id);
      } else {
        await supabase.from('boodschappen_items').update(action.changes).eq('id', action.id);
      }
    }

    // --- Item bewerken ---
    const editModalOverlay = document.getElementById('edit-modal-overlay');
    const editNaamInput = document.getElementById('edit-naam-input');
    const editDetailInput = document.getElementById('edit-detail-input');
    const editWinkelInput = document.getElementById('edit-winkel-input');
    const editCategorieSelect = document.getElementById('edit-categorie-select');
    let editingItemId = null;

    function openEditModal(item) {
      editingItemId = item.id;
      editNaamInput.value = item.naam;
      editDetailInput.value = item.detail || '';
      editWinkelInput.value = item.winkel || '';
      editCategorieSelect.value = item.categorie;
      editModalOverlay.classList.add('open');
    }
    document.getElementById('close-edit-modal').addEventListener('click', () => {
      editModalOverlay.classList.remove('open');
      editingItemId = null;
    });
    document.getElementById('edit-save-btn').addEventListener('click', async () => {
      if (editingItemId == null) return;
      let changes;
      try {
        changes = GezinBoodschappen.buildUpdatePayload({
          naam: editNaamInput.value,
          detail: editDetailInput.value,
          categorie: editCategorieSelect.value,
          winkel: editWinkelInput.value,
        });
      } catch (err) {
        alert(err.message);
        return;
      }
      const { error } = await supabase.from('boodschappen_items').update(changes).eq('id', editingItemId);
      if (error) { alert('Kon niet opslaan: ' + error.message); return; }
      editModalOverlay.classList.remove('open');
      editingItemId = null;
    });

    async function cleanupExpiredItems() {
      const idsToDelete = GezinBoodschappen.cleanupExpired(items);
      if (idsToDelete.length === 0) return;
      await supabase.from('boodschappen_items').delete().in('id', idsToDelete);
    }

    function render() {
      const groups = GezinBoodschappen.sortItems(items);
      if (groups.length === 0) {
        lijstEl.innerHTML = '<div class="empty-state">Boodschappenlijst is leeg 🎉</div>';
        return;
      }
      lijstEl.innerHTML = groups.map(g => `
        <div class="categorie-groep">
          <div class="categorie-titel">${g.categorie}</div>
          <ul class="items">
            ${g.items.map(item => `
              <li class="item ${item.afgevinkt ? 'afgevinkt' : ''}" data-id="${item.id}">
                <div class="checkbox" data-role="toggle">${item.afgevinkt ? '✓' : ''}</div>
                <div class="item-main" data-role="toggle">
                  <div class="item-naam">${escapeHtml(item.naam)}${item.detail ? ' — ' + escapeHtml(item.detail) : ''}</div>
                </div>
                ${item.winkel ? `<span class="badge-winkel">${escapeHtml(item.winkel)}</span>` : ''}
                <button class="edit-btn" data-role="edit" title="Bewerken">✏️</button>
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');

      lijstEl.querySelectorAll('.item').forEach(el => {
        const id = el.getAttribute('data-id');
        el.querySelectorAll('[data-role="toggle"]').forEach(part => {
          part.addEventListener('click', () => {
            const item = items.find(i => String(i.id) === String(id));
            if (item) toggleItem(item);
          });
        });
        el.querySelector('[data-role="edit"]').addEventListener('click', () => {
          const item = items.find(i => String(i.id) === String(id));
          if (item) openEditModal(item);
        });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadItems() {
      const { data, error } = await supabase.from('boodschappen_items').select('*');
      if (error) { console.error(error); return; }
      items = data || [];
      render();
    }

    async function loadVasteArtikelen() {
      const { data, error } = await supabase.from('boodschappen_vaste_artikelen').select('*');
      if (error) { console.error(error); return; }
      vasteArtikelen = data || [];
      renderVasteLijst();
    }

    // --- Vaste artikelen modal ---
    const vastModalOverlay = document.getElementById('vaste-modal-overlay');
    document.getElementById('open-vaste-artikelen').addEventListener('click', () => {
      vastModalOverlay.classList.add('open');
    });
    document.getElementById('close-vaste-modal').addEventListener('click', () => {
      vastModalOverlay.classList.remove('open');
    });
    document.getElementById('vast-add-btn').addEventListener('click', async () => {
      const naamEl = document.getElementById('vast-naam-input');
      const catEl = document.getElementById('vast-categorie-select');
      if (!naamEl.value.trim()) { alert('Naam is verplicht'); return; }
      const { error } = await supabase.from('boodschappen_vaste_artikelen').insert({
        naam: naamEl.value.trim(),
        categorie: catEl.value,
      });
      if (error) { alert('Kon niet toevoegen: ' + error.message); return; }
      naamEl.value = '';
    });

    function renderVasteLijst() {
      const el = document.getElementById('vaste-lijst');
      const sorted = [...vasteArtikelen].sort((a, b) => a.naam.localeCompare(b.naam, 'nl'));
      el.innerHTML = sorted.map(v => `
        <div class="vast-item-row" data-id="${v.id}">
          <span class="naam">${escapeHtml(v.naam)}</span>
          <span class="cat">${escapeHtml(v.categorie)}</span>

          <button data-action="delete">🗑</button>
        </div>
      `).join('');
      el.querySelectorAll('[data-action="add"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.closest('.vast-item-row').getAttribute('data-id');
          const vastArtikel = vasteArtikelen.find(v => String(v.id) === String(id));
          if (!vastArtikel) return;
          const payload = GezinBoodschappen.buildInsertPayload({
            naam: vastArtikel.naam,
            categorie: vastArtikel.categorie,
            vastArtikel,
          });
          await insertItem(payload);
        });
      });
      el.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.closest('.vast-item-row').getAttribute('data-id');

        });
      });
    }

    // --- Kalender-tab ---
    let afspraken = [];
    let verjaardagen = [];
    const vandaag = new Date();
    let bekekenJaar = vandaag.getFullYear();
    let bekekenMaand = vandaag.getMonth(); // 0-indexed

    const maandLabelEl = document.getElementById('maand-label');
    const agendaLijstEl = document.getElementById('agenda-lijst');
    const afspraakTitelInput = document.getElementById('afspraak-titel-input');
    const afspraakDatumInput = document.getElementById('afspraak-datum-input');
    const afspraakTijdInput = document.getElementById('afspraak-tijd-input');
    const afspraakEindtijdInput = document.getElementById('afspraak-eindtijd-input');

    // Herbruikbare "betrokkenen aanvinken"-component — gebruikt door zowel
    // het toevoegformulier als het bewerk-modal, die elk hun eigen DOM-container
    // hebben (bewust dubbel: twee schermen delen geen enkel DOM-element).
    function maakBetrokkenenKies(containerEl) {
      containerEl.innerHTML = GezinKalender.BETROKKENEN.map(b => `
        <label class="betrokkene-optie" data-key="${b.key}">
          <input type="checkbox" value="${b.key}">
          <span class="betrokkene-avatar">${BETROKKENE_ICONEN[b.icoon]}</span>
          ${escapeHtml(b.naam)}
        </label>
      `).join('');
      containerEl.querySelectorAll('.betrokkene-optie').forEach(label => {
        const checkbox = label.querySelector('input');
        checkbox.addEventListener('change', () => {
          label.classList.toggle('gekozen', checkbox.checked);
        });
      });
      return {
        getGekozen: () => [...containerEl.querySelectorAll('input:checked')].map(el => el.value),
        setGekozen: (keys) => {
          containerEl.querySelectorAll('input').forEach(el => {
            el.checked = keys.includes(el.value);
            el.closest('.betrokkene-optie').classList.toggle('gekozen', el.checked);
          });
        },
        reset: () => {
          containerEl.querySelectorAll('input').forEach(el => { el.checked = false; });
          containerEl.querySelectorAll('.betrokkene-optie').forEach(el => el.classList.remove('gekozen'));
        },
      };
    }

    const afspraakBetrokkenenKies = maakBetrokkenenKies(document.getElementById('afspraak-betrokkenen-kies'));
    const editBetrokkenenKies = maakBetrokkenenKies(document.getElementById('edit-afspraak-betrokkenen-kies'));

    afspraakDatumInput.value = GezinKalender.toIsoDate(vandaag);

    function populateMaandSelect() {
      const sel = document.getElementById('verjaardag-maand-select');
      sel.innerHTML = GezinKalender.MAAND_NAMEN.map((naam, i) => `<option value="${i + 1}">${naam}</option>`).join('');
    }
    populateMaandSelect();

    function renderBetrokkeneBadges(keys) {
      return `<div class="betrokkenen-rij">${keys.map(key => {
        const b = GezinKalender.BETROKKENEN.find(x => x.key === key);
        if (!b) return '';
        return `<span class="betrokkene-avatar" title="${escapeHtml(b.naam)}">${BETROKKENE_ICONEN[b.icoon]}</span>`;
      }).join('')}</div>`;
    }

    function formatTijdWeergave(item) {
      if (item.type === 'verjaardag') return '🎂';
      if (!item.tijd) return '';
      return item.eindtijd ? `${item.tijd} - ${item.eindtijd}` : item.tijd;
    }

    function renderMaandLabel() {
      maandLabelEl.textContent = GezinKalender.monthLabel(bekekenJaar, bekekenMaand);
    }

    function renderVerjaardagenOverzicht() {
      const el = document.getElementById('verjaardagen-overzicht');
      const overzicht = GezinKalender.getBirthdaysOverviewForMonth(verjaardagen, bekekenJaar, bekekenMaand);
      el.innerHTML = `
        <div class="verjaardagen-overzicht">
          <div class="titel-rij">
            <span class="titel">🎂 Verjaardagen in ${GezinKalender.MAAND_NAMEN[bekekenMaand]}</span>
            <button class="verjaardag-add-icon-btn" id="open-verjaardag-modal" title="Verjaardag toevoegen">🎂<span class="plus-badge">+</span></button>
          </div>
          ${overzicht.length === 0 ? '<div style="color:var(--muted);">Geen verjaardagen deze maand</div>' : overzicht.map(v => `
            <div class="rij">
              <span>${escapeHtml(v.naam)} — ${v.dag} ${GezinKalender.MAAND_NAMEN[bekekenMaand]}${v.leeftijd !== null ? ` (wordt ${v.leeftijd} jaar)` : ''}</span>
            </div>
          `).join('')}
        </div>
      `;
      // Knop wordt elke render opnieuw aangemaakt (innerHTML), dus listener elke keer opnieuw koppelen.
      document.getElementById('open-verjaardag-modal').addEventListener('click', () => {
        document.getElementById('verjaardag-modal-overlay').classList.add('open');
      });
    }

    let editingAfspraakId = null;

    function renderAgenda() {
      renderMaandLabel();
      renderVerjaardagenOverzicht();
      const dagen = GezinKalender.buildMonthAgenda(afspraken, verjaardagen, bekekenJaar, bekekenMaand, vandaag);
      if (dagen.length === 0) {
        agendaLijstEl.innerHTML = '<div class="empty-state">Geen afspraken deze maand 🎉</div>';
        return;
      }
      agendaLijstEl.innerHTML = dagen.map(dag => `
        <div class="agenda-dag-groep ${dag.verleden ? 'verleden' : ''}">
          <div class="agenda-dag-titel">${formatDagTitel(dag.datum)}</div>
          ${dag.items.map(item => `
            <div class="agenda-item ${item.type === 'verjaardag' ? 'verjaardag' : ''}" ${item.type === 'afspraak' ? `data-id="${item.id}"` : ''}>
              <span class="tijd">${formatTijdWeergave(item)}</span>
              <span class="titel">${item.type === 'afspraak' && item.reeks_id ? '🔁 ' : ''}${escapeHtml(item.titel)}</span>
              ${item.type === 'afspraak' ? renderBetrokkeneBadges(item.betrokkenen) : ''}
              ${item.type === 'afspraak' ? `<button class="edit-btn" data-role="edit-afspraak" title="Bewerken">✏️</button>` : ''}
            </div>
          `).join('')}
        </div>
      `).join('');

      agendaLijstEl.querySelectorAll('[data-role="edit-afspraak"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.closest('.agenda-item').getAttribute('data-id');

          if (afspraak) openAfspraakEditModal(afspraak);
        });
      });
    }


    function formatDagTitel(isoDatum) {
      const [y, m, d] = isoDatum.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const dagNamen = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
      return `${dagNamen[date.getDay()]} ${d} ${GezinKalender.MAAND_NAMEN[m - 1]}`;
    }

    document.getElementById('maand-vorige').addEventListener('click', () => {
      bekekenMaand--;
      if (bekekenMaand < 0) { bekekenMaand = 11; bekekenJaar--; }
      renderAgenda();
    });
    document.getElementById('maand-volgende').addEventListener('click', () => {
      bekekenMaand++;
      if (bekekenMaand > 11) { bekekenMaand = 0; bekekenJaar++; }
      renderAgenda();
    });
    document.getElementById('maand-vandaag').addEventListener('click', () => {
      bekekenJaar = vandaag.getFullYear();
      bekekenMaand = vandaag.getMonth();
      renderAgenda();
    });

    document.getElementById('afspraak-add-btn').addEventListener('click', async () => {
      let payload;
      try {
        payload = GezinKalender.buildAfspraakInsertPayload({
          titel: afspraakTitelInput.value,
          datum: afspraakDatumInput.value,
          tijd: afspraakTijdInput.value,
          eindtijd: afspraakEindtijdInput.value,
          betrokkenen: afspraakBetrokkenenKies.getGekozen(),
        });
      } catch (err) {
        alert(err.message);
        return;
      }
      const frequentie = document.getElementById('afspraak-herhaal-select').value;

      if (!frequentie) {
        // Eenmalige afspraak — ongewijzigd gedrag.
        const { error } = await supabase.from('kalender_afspraken').insert(payload);
        if (error) { alert('Kon niet toevoegen: ' + error.message); return; }
      } else {
        // Herhalende afspraak (optie A): eerst de reeks aanmaken, dan elke
        // voorkomen als eigen, losse rij wegschrijven met reeks_id erbij.
        let reeksData;
        try {
          reeksData = GezinKalender.buildReeksInsertPayload({ frequentie, startDatum: payload.datum, vandaag });
        } catch (err) {
          alert(err.message);
          return;
        }
        const { data: reeksRows, error: reeksError } = await supabase.from('kalender_reeksen').insert(reeksData.reeksPayload).select();

        const reeksId = reeksRows[0].id;
        const rijen = reeksData.datums.map(datum => ({ ...payload, datum, reeks_id: reeksId }));
        const { error: rijenError } = await supabase.from('kalender_afspraken').insert(rijen);
        if (rijenError) { alert('Kon de reeks niet toevoegen: ' + rijenError.message); return; }

      afspraakTitelInput.value = '';
      afspraakTijdInput.value = '';
      afspraakEindtijdInput.value = '';
      afspraakDatumInput.value = GezinKalender.toIsoDate(vandaag);
      document.getElementById('afspraak-herhaal-select').value = '';
      afspraakBetrokkenenKies.reset();
    });

    // --- Afspraak bewerken ---
    const afspraakEditModalOverlay = document.getElementById('afspraak-edit-modal-overlay');
    let editingAfspraakReeksId = null;
    function openAfspraakEditModal(afspraak) {
      editingAfspraakId = afspraak.id;
      editingAfspraakReeksId = afspraak.reeks_id || null;

      document.getElementById('edit-afspraak-datum-input').value = afspraak.datum;

      editBetrokkenenKies.setGekozen(afspraak.betrokkenen || []);
      document.getElementById('edit-afspraak-reeks-sectie').style.display = editingAfspraakReeksId ? '' : 'none';
      afspraakEditModalOverlay.classList.add('open');
    }
    document.getElementById('close-afspraak-edit-modal').addEventListener('click', () => {
      afspraakEditModalOverlay.classList.remove('open');
      editingAfspraakId = null;
      editingAfspraakReeksId = null;
    });
    document.getElementById('edit-afspraak-save-btn').addEventListener('click', async () => {
      if (editingAfspraakId == null) return;
      let payload;
      try {
        payload = GezinKalender.buildAfspraakUpdatePayload({
          titel: document.getElementById('edit-afspraak-titel-input').value,
          datum: document.getElementById('edit-afspraak-datum-input').value,
          tijd: document.getElementById('edit-afspraak-tijd-input').value,
          eindtijd: document.getElementById('edit-afspraak-eindtijd-input').value,
          betrokkenen: editBetrokkenenKies.getGekozen(),
        });
      } catch (err) {
        alert(err.message);
        return;
      }
      const { error } = await supabase.from('kalender_afspraken').update(payload).eq('id', editingAfspraakId);
      if (error) { alert('Kon niet opslaan: ' + error.message); return; }
      afspraakEditModalOverlay.classList.remove('open');
      editingAfspraakId = null;
      editingAfspraakReeksId = null;
    });
    document.getElementById('edit-afspraak-stop-reeks-btn').addEventListener('click', async () => {
      if (!editingAfspraakReeksId) return;
      if (!confirm('Deze reeks stoppen? Toekomstige voorkomens (vanaf vandaag) worden verwijderd. Al geweest zijnde voorkomens blijven staan.')) return;
      const vandaagIso = GezinKalender.toIsoDate(vandaag);
      const { error: deleteError } = await supabase.from('kalender_afspraken')
        .delete().eq('reeks_id', editingAfspraakReeksId).gte('datum', vandaagIso);
      if (deleteError) { alert('Kon de reeks niet stoppen: ' + deleteError.message); return; }
      const { error: stopError } = await supabase.from('kalender_reeksen')
        .update({ gestopt_op: vandaagIso }).eq('id', editingAfspraakReeksId);
      if (stopError) { alert('Kon de reeks niet volledig afsluiten: ' + stopError.message); return; }
      afspraakEditModalOverlay.classList.remove('open');
      editingAfspraakId = null;
      editingAfspraakReeksId = null;
    });

    // --- Verjaardag-modal ---
    // (De open-knop wordt dynamisch aangemaakt in renderVerjaardagenOverzicht en koppelt daar zijn eigen listener.)
    document.getElementById('close-verjaardag-modal').addEventListener('click', () => {
      document.getElementById('verjaardag-modal-overlay').classList.remove('open');
    });
    document.getElementById('verjaardag-add-btn').addEventListener('click', async () => {
      let payload;
      try {
        payload = GezinKalender.buildVerjaardagInsertPayload({
          naam: document.getElementById('verjaardag-naam-input').value,
          dag: document.getElementById('verjaardag-dag-input').value,
          maand: document.getElementById('verjaardag-maand-select').value,
          jaar: document.getElementById('verjaardag-jaar-input').value,
        });
      } catch (err) {
        alert(err.message);
        return;
      }
      const { error } = await supabase.from('kalender_verjaardagen').insert(payload);
      if (error) { alert('Kon niet toevoegen: ' + error.message); return; }
      document.getElementById('verjaardag-naam-input').value = '';
      document.getElementById('verjaardag-dag-input').value = '';
      document.getElementById('verjaardag-jaar-input').value = '';
    });

    function renderVerjaardagenLijst() {
      const el = document.getElementById('verjaardagen-lijst');
      const sorted = [...verjaardagen].sort((a, b) => (a.maand - b.maand) || (a.dag - b.dag));
      el.innerHTML = sorted.map(v => `
        <div class="vast-item-row" data-id="${v.id}">
          <span class="naam">${escapeHtml(v.naam)}</span>
          <span class="cat">${v.dag} ${GezinKalender.MAAND_NAMEN[v.maand - 1]}${v.jaar ? ` (${v.jaar})` : ''}</span>
          <button data-action="delete-verjaardag">🗑</button>
        </div>
      `).join('');
      el.querySelectorAll('[data-action="delete-verjaardag"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.closest('.vast-item-row').getAttribute('data-id');
          await supabase.from('kalender_verjaardagen').delete().eq('id', id);
        });
      });
    }

    async function loadAfspraken() {
      const { data, error } = await supabase.from('kalender_afspraken').select('*');
      if (error) { console.error(error); return; }
      afspraken = data || [];
      renderAgenda();
    }

    async function loadVerjaardagen() {
      const { data, error } = await supabase.from('kalender_verjaardagen').select('*');
      if (error) { console.error(error); return; }
      verjaardagen = data || [];
      renderVerjaardagenLijst();
      renderAgenda();
    }

    // --- Realtime ---
    function subscribeRealtime() {
      supabase.channel('boodschappen_items_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'boodschappen_items' }, () => {
          loadItems();
        })
        .subscribe();
      supabase.channel('vaste_artikelen_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'boodschappen_vaste_artikelen' }, () => {
          loadVasteArtikelen();
        })
        .subscribe();
      supabase.channel('kalender_afspraken_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'kalender_afspraken' }, () => {
          loadAfspraken();
        })
        .subscribe();
      supabase.channel('kalender_verjaardagen_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'kalender_verjaardagen' }, () => {
          loadVerjaardagen();
        })
        .subscribe();
    }

    // Verlengt elke actieve reeks stilzwijgend zodra de horizon minder dan
    // VERLENG_DREMPEL_MAANDEN vooruit reikt — draait bij elke app-start.
    async function verlengActieveReeksen() {
      const { data: reeksen, error } = await supabase.from('kalender_reeksen').select('*').is('gestopt_op', null);
      if (error) { console.error(error); return; }
      for (const reeks of (reeksen || [])) {
        if (!GezinKalender.moetReeksVerlengdWorden(reeks.gegenereerd_tot, vandaag)) continue;
        const startDatum = GezinKalender.berekenVolgendeDatum(reeks.gegenereerd_tot, reeks.frequentie);
        const nieuweHorizon = GezinKalender.berekenNieuweHorizon(vandaag);
        const nieuweDatums = GezinKalender.genereerReeksData(startDatum, reeks.frequentie, nieuweHorizon);
        if (nieuweDatums.length === 0) continue;
        // Basis-gegevens (titel/tijd/eindtijd/betrokkenen) overnemen van het laatst
        // bekende voorkomen in deze reeks — die zijn voor elk voorkomen gelijk,
        // behalve als iemand een los voorkomen heeft bewerkt (dat raakt de reeks niet).
        const { data: laatsteRij } = await supabase.from('kalender_afspraken')
          .select('*').eq('reeks_id', reeks.id).order('datum', { ascending: false }).limit(1);
        if (!laatsteRij || laatsteRij.length === 0) continue;
        const basis = laatsteRij[0];
        const nieuweRijen = nieuweDatums.map(datum => ({
          titel: basis.titel, tijd: basis.tijd, eindtijd: basis.eindtijd, betrokkenen: basis.betrokkenen,
          datum, reeks_id: reeks.id,
        }));
        await supabase.from('kalender_afspraken').insert(nieuweRijen);
        await supabase.from('kalender_reeksen').update({ gegenereerd_tot: nieuweHorizon }).eq('id', reeks.id);
      }
    }

    // --- Init ---
    (async function init() {
      if (!supabase) { console.error('Supabase-client kon niet worden aangemaakt.'); return; }
      await loadVasteArtikelen();
      await cleanupExpiredItems();
      await loadItems();
      await verlengActieveReeksen();
      await loadAfspraken();
      await loadVerjaardagen();
      subscribeRealtime();
    })();
  })();
}
</script>
</body>
</html>
